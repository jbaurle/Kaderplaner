<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Score je Spieler, beste Elf, vier Szenarien. Im Browser, ohne Server."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kickbase Kaderplaner</title>

    <!--
      Setzt den Dunkel-Modus, bevor irgendetwas gezeichnet wird — sonst
      blitzt die Seite hell auf und springt danach um. Das echte Umschalten
      übernimmt src/ui/theme.ts, hier nur der gespeicherte Stand vorab.
      Derselbe Schlüssel wie storage/local.ts (Namespace "kb.").
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('kb.theme') === '"dark"') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <!--
      Vorschaukarte in WhatsApp, Slack, X und Co. Absolute Adressen, denn die
      Crawler lösen relative Pfade nicht auf. Das Bild liegt in `public/` und
      wandert damit unverändert nach `dist/`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kickbase Kaderplaner" />
    <meta property="og:title" content="Kickbase Kaderplaner" />
    <meta
      property="og:description"
      content="Score je Spieler, beste Elf, vier Szenarien. Im Browser, ohne Server."
    />
    <meta property="og:url" content="https://kaderplaner.de/" />
    <meta property="og:image" content="https://kaderplaner.de/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Kickbase Kaderplaner" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
