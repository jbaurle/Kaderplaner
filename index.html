<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Score je Spieler, beste Elf, vier Szenarien. Im Browser, ohne Server."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kickbase Kaderplaner</title>

    <!--
      Auf dem Startbildschirm abgelegt startet die Seite ohne Adressleiste.
      Das regelt `display: standalone` im Manifest; iOS vor 16.4 liest das
      Manifest nicht, dafür steht das alte Apple-Meta daneben. Chrome mahnt es
      als veraltet an und will `mobile-web-app-capable`, also beide.
      `theme-color` färbt die Statusleiste und steht dunkel wie der Standard,
      das Skript darunter zieht Hell nach, wenn es gespeichert ist.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kaderplaner" />
    <meta name="theme-color" content="#12181c" />

    <!--
      Setzt das Design, bevor irgendetwas gezeichnet wird, sonst blitzt die
      Seite auf und springt danach um. Dunkel ist der Standard: nur ein
      gespeichertes "light" hält die Seite hell. Das echte Umschalten
      übernimmt src/ui/theme.ts.

      Derselbe Schlüssel wie storage/local.ts (Namespace "kb."). Der Wrapper
      schreibt durch JSON.stringify, im Speicher steht also "light" mit
      Anführungszeichen. Beide Schreibweisen gelten hier, damit dieses Skript
      nicht still ins Leere läuft, falls der Wrapper das Format ändert; ein
      Test in tests/theme.test.ts hält die Erwartung fest.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('kb.theme');
          if (stored === '"light"' || stored === 'light') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f4f6f9');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <!--
      Vorschaukarte in WhatsApp, Slack, X und Co. Absolute Adressen, denn die
      Crawler lösen relative Pfade nicht auf. Das Bild liegt in `public/` und
      wandert damit unverändert nach `dist/`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kickbase Kaderplaner" />
    <meta property="og:title" content="Kickbase Kaderplaner" />
    <meta
      property="og:description"
      content="Score je Spieler, beste Elf, vier Szenarien. Im Browser, ohne Server."
    />
    <meta property="og:url" content="https://kaderplaner.de/" />
    <meta property="og:image" content="https://kaderplaner.de/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Kickbase Kaderplaner" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
